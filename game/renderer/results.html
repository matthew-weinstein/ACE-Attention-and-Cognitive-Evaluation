<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACE Assessment — Doctor View</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          160deg,
          #0a0e27 0%,
          #151b3d 55%,
          #1a1042 100%
        );
        color: #fff;
        min-height: 100vh;
        padding: 40px 24px 60px;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 40px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .header-left h1 {
        font-size: 42px;
        font-weight: 800;
        background: linear-gradient(90deg, #818cf8, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        line-height: 1.1;
      }
      .header-left p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 15px;
        margin-top: 6px;
      }
      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      /* ── Buttons ── */
      .btn {
        padding: 11px 28px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      }
      .btn-primary:hover {
        box-shadow: 0 6px 18px rgba(99, 102, 241, 0.6);
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.07);
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.13);
      }

      /* ── Hero metrics ── */
      .hero-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .hero-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        padding: 22px 20px;
        position: relative;
        overflow: hidden;
      }
      .hero-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.08),
          transparent 60%
        );
        pointer-events: none;
      }
      .hero-card .metric-icon {
        font-size: 22px;
        margin-bottom: 10px;
        display: block;
      }
      .hero-card .metric-value {
        font-size: 38px;
        font-weight: 800;
        color: #818cf8;
        line-height: 1;
      }
      .hero-card .metric-unit {
        font-size: 16px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.5);
        margin-left: 3px;
      }
      .hero-card .metric-label {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
        margin-top: 6px;
      }
      .hero-card .metric-badge {
        display: inline-block;
        margin-top: 8px;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .badge-normal {
        background: rgba(34, 197, 94, 0.18);
        color: #4ade80;
      }
      .badge-low {
        background: rgba(251, 191, 36, 0.18);
        color: #fbbf24;
      }
      .badge-high {
        background: rgba(239, 68, 68, 0.18);
        color: #f87171;
      }

      /* ── Section cards ── */
      .section {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 16px;
        padding: 28px;
        margin-bottom: 24px;
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .section-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(99, 102, 241, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .section-header h2 {
        font-size: 20px;
        font-weight: 700;
        color: #c7d2fe;
      }
      .section-header p {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 2px;
      }

      /* ── Comparison bars ── */
      .compare-row {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .compare-item {
        flex: 1;
        min-width: 180px;
      }
      .compare-item label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.45);
        display: block;
        margin-bottom: 8px;
      }
      .compare-item .cval {
        font-size: 28px;
        font-weight: 700;
        color: #e0e7ff;
      }
      .compare-item .cunit {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        margin-left: 3px;
      }
      .bar-track {
        margin-top: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s ease;
      }
      .bar-phase1 {
        background: linear-gradient(90deg, #6366f1, #818cf8);
      }
      .bar-phase2 {
        background: linear-gradient(90deg, #8b5cf6, #a78bfa);
      }
      .normal-band {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        margin-top: 5px;
      }

      /* ── Chart containers ── */
      .chart-wrap {
        position: relative;
        height: 240px;
      }
      .chart-wrap.tall {
        height: 300px;
      }

      /* ── Two-column layout inside a section ── */
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 680px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      /* ── Donut label ── */
      .donut-wrap {
        position: relative;
      }
      .donut-centre {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
      .donut-centre .dc-val {
        font-size: 30px;
        font-weight: 800;
        color: #818cf8;
        line-height: 1;
      }
      .donut-centre .dc-label {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 3px;
      }

      /* ── Phase legend pill ── */
      .legend-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .legend-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      /* ── No data ── */
      .no-data {
        text-align: center;
        padding: 80px 20px;
        color: rgba(255, 255, 255, 0.35);
        font-size: 18px;
      }

      /* ── Info note ── */
      .info-note {
        margin-top: 18px;
        padding: 12px 16px;
        background: rgba(99, 102, 241, 0.08);
        border-left: 3px solid rgba(99, 102, 241, 0.5);
        border-radius: 0 8px 8px 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-left">
          <h1>Assessment Results</h1>
          <p id="sessionMeta">Loading…</p>
        </div>
        <div class="header-actions">
          <a href="index.html" class="btn btn-ghost">← Back</a>
          <button onclick="exportData()" class="btn btn-primary">
            Export JSON
          </button>
        </div>
      </div>

      <div id="content">
        <div class="no-data">Loading assessment data…</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="head_fidget_visualizer.js"></script>
    <script src="results.js"></script>
  </body>
</html>
