<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACE Assessment Results - Doctor View</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0a0e27 0%, #151b3d 50%, #1a1042 100%);
        color: #ffffff;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 48px;
        color: #6366f1;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      }

      .header p {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.7);
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .card h2 {
        color: #818cf8;
        margin-bottom: 20px;
        font-size: 28px;
        border-bottom: 2px solid rgba(129, 140, 248, 0.3);
        padding-bottom: 10px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .stat-box {
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
      }

      .stat-box .value {
        font-size: 42px;
        font-weight: bold;
        color: #6366f1;
        margin-bottom: 5px;
      }

      .stat-box .label {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.7);
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      .data-table th,
      .data-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .data-table th {
        background: rgba(99, 102, 241, 0.2);
        color: #818cf8;
        font-weight: bold;
      }

      .data-table tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .button-group {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 40px;
      }

      .btn {
        padding: 15px 40px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: white;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .no-data {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 20px;
      }

      .cycle-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        margin-right: 10px;
      }

      .cycle-1 {
        background: rgba(255, 99, 132, 0.3);
        color: #ff6384;
      }

      .cycle-2 {
        background: rgba(54, 162, 235, 0.3);
        color: #36a2eb;
      }

      .cycle-3 {
        background: rgba(75, 192, 192, 0.3);
        color: #4bc0c0;
      }

      .phase-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
      }

      .phase-1 {
        background: rgba(255, 206, 86, 0.3);
        color: #ffce56;
      }

      .phase-2 {
        background: rgba(153, 102, 255, 0.3);
        color: #9966ff;
      }

      .chart-container {
        position: relative;
        height: 400px;
        margin-top: 20px;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .metric-item {
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 6px;
        padding: 15px;
      }

      .metric-item .metric-label {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 5px;
      }

      .metric-item .metric-value {
        font-size: 24px;
        font-weight: bold;
        color: #818cf8;
      }

      .metric-item .metric-unit {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📊 Assessment Results</h1>
        <p>Doctor View - ACE Evaluation Data</p>
      </div>

      <div id="content">
        <div class="no-data">Loading assessment data...</div>
      </div>

      <div class="button-group">
        <a href="index.html" class="btn btn-secondary">← Back to Game</a>
        <button onclick="exportData()" class="btn btn-primary">
          Export Data
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="head_fidget_visualizer.js"></script>
    <script src="results.js"></script>
  </body>
</html>
